<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Aventura Matemática 4.° Primaria</title><style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Segoe UI,Tahoma,sans-serif;user-select:none}body{background:#1a1a2e;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:10px}#game{width:100%;max-width:800px;background:#16213e;border-radius:16px;overflow:hidden;border:4px solid #0f3460;box-shadow:0 10px 30px #0008}header{background:#0f3460;padding:15px 20px;display:flex;justify-content:space-between;font-weight:bold}.stats{display:flex;gap:20px}.map{padding:30px 20px;display:flex;flex-direction:column;align-items:center;background:linear-gradient(#5c94fc,#80d0c7);min-height:450px}.title{text-align:center;margin-bottom:30px;text-shadow:2px 2px 4px #000}.path{display:flex;flex-direction:column;align-items:center;gap:25px}.node{width:70px;height:70px;border-radius:50%;background:#e74c3c;border:4px solid white;display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:bold;cursor:pointer;box-shadow:0 6px 0 #952313}.node.completed{background:#2ecc71;box-shadow:0 6px 0 #27ae60}.node.locked{background:#7f8c8d;box-shadow:0 6px 0 #bdc3c7;opacity:.7;cursor:not-allowed}.line{width:8px;height:30px;background:white;border-radius:4px}.exercise{display:none;padding:25px;flex-direction:column;gap:20px;min-height:450px}.card{background:#0f3460;border-radius:12px;padding:20px;border-left:6px solid #e94560}.tag{font-size:.9rem;color:#e94560;font-weight:bold;margin-bottom:8px;text-transform:uppercase}.text{font-size:1.2rem;line-height:1.6;color:#eee}.options{display:grid;grid-template-columns:1fr 1fr;gap:15px}.option{background:#1a1a2e;color:white;border:2px solid #0f3460;padding:15px;border-radius:10px;font-size:1.1rem;cursor:pointer;text-align:left}.option:hover{border-color:#e94560;background:#0f3460}.prefix{display:inline-flex;background:#e94560;width:28px;height:28px;border-radius:50%;align-items:center;justify-content:center;margin-right:10px}.modal{display:none;position:fixed;inset:0;background:#000c;justify-content:center;align-items:center;padding:20px}.modalbox{background:#16213e;border:3px solid #0f3460;border-radius:16px;padding:25px;max-width:450px;text-align:center}.icon{font-size:3.5rem}.mt{margin:10px 0}.mb{margin-bottom:20px;color:#ccc;line-height:1.5}.btn{background:#e94560;color:white;border:0;padding:12px 25px;border-radius:8px;font-weight:bold;cursor:pointer}@media(max-width:600px){.options{grid-template-columns:1fr}}
</style></head><body><div id="game"><header><div class="stats"><span>❤️ <b id="lives">3</b></span><span>🪙 <b id="coins">0</b></span></div><span id="display">Mapa de Niveles</span></header><section id="map" class="map"><h2 class="title">🎮 MUNDO MATEMÁTICO 🎮</h2><div class="path"><div class="node completed" onclick="start(1)">1</div><div class="line"></div><div class="node locked" id="n2" onclick="start(2)">2</div><div class="line"></div><div class="node locked" id="n3" onclick="start(3)">3</div><div class="line"></div><div class="node locked" id="n4" onclick="start(4)">4</div></div></section><section id="exercise" class="exercise"><div class="card"><div id="tag" class="tag"></div><div id="question" class="text"></div></div><div id="options" class="options"></div></section></div><div id="modal" class="modal"><div class="modalbox"><div id="mi" class="icon">🎉</div><h2 id="mt" class="mt"></h2><div id="mx" class="mb"></div><button id="mb" class="btn">Continuar</button></div></div><script>
const data={1:{tag:'Nivel 1: Lectura de Números Grandes',q:"En una excursión escolar, los estudiantes leyeron en un letrero que el Parque Nacional tiene <b>veinticuatro mil quinientos ocho</b> hectáreas de bosques. ¿Cómo se escribe este número en cifras?",o:[['A','24,580',0,"Revisa la última cifra: 'ocho' significa que termina en 8, no en 80."],['B','24,508',1,'¡Excelente! 24 mil + 500 + 8 = 24,508.'],['C','245,008',0,"Este número se lee 'doscientos cuarenta y cinco mil ocho'."],['D','2,458',0,"La lectura dice veinticuatro mil."]]},2:{tag:'Nivel 2: Comprensión de Operaciones',q:'Sofía está juntando dinero para comprar un libro que cuesta $45.000. Si ya tiene $28.500, ¿qué operación debe hacer para saber cuánto le falta?',o:[['A','Multiplicar $45.000 por $28.500',0,'La multiplicación no busca la diferencia.'],['B','Sumar $45.000 + $28.500',0,'La suma daría una cantidad mayor al costo.'],['C','Restar $45.000 - $28.500',1,'¡Correcto! Para saber cuánto falta usamos la resta.'],['D','Dividir $45.000 entre 2',0,'Eso calcula la mitad, no la diferencia.']]},3:{tag:'Nivel 3: Fracciones en la Vida Real',q:'Una pizza se divide en 8 rebanadas iguales. Si Carlos se come 3, ¿qué fracción queda?',o:[['A','3/8',0,'3/8 es la parte que se comió.'],['B','5/8',1,'¡Muy bien! 8/8 - 3/8 = 5/8.'],['C','3/5',0,'El total de partes es 8.'],['D','8/3',0,'No representa las partes restantes.']]},4:{tag:'Nivel 4: Perímetro y Geometría',q:'Un parque rectangular tiene 15 m de largo y 10 m de ancho. ¿Cuántos metros recorre un niño al dar una vuelta completa?',o:[['A','25 metros',0,'Solo sumaste un largo y un ancho.'],['B','150 metros',0,'15 × 10 calcula el área.'],['C','50 metros',1,'¡Perfecto! 15 + 10 + 15 + 10 = 50 metros.'],['D','30 metros',0,'30 es solo 15 + 15.']]}};
let level=1,unlocked=1,lives=3,coins=0;const $=id=>document.getElementById(id);function start(n){if(n>unlocked)return;level=n;$('display').textContent='Nivel '+n;$('tag').textContent=data[n].tag;$('question').innerHTML=data[n].q;$('options').innerHTML='';data[n].o.forEach(x=>{let b=document.createElement('button');b.className='option';b.innerHTML='<span class="prefix">'+x[0]+'</span>'+x[1];b.onclick=()=>answer(x);$('options').appendChild(b)});$('map').style.display='none';$('exercise').style.display='flex'}function answer(x){if(x[2]){coins+=10;$('coins').textContent=coins;if(level===unlocked&&unlocked<4){unlocked++;$('n'+unlocked).classList.remove('locked');$('n'+unlocked).classList.add('completed')}show('🎉','¡Excelente trabajo!','¡Respuesta correcta! Ganaste 10 monedas.<br><br><b>Explicación:</b> '+x[3],'Continuar',map)}else{lives--;$('lives').textContent=lives;if(lives<=0)show('💔','¡Sin vidas!','Te has quedado sin vidas.<br><br><b>Pista:</b> '+x[3],'Reiniciar juego',restart);else show('❌','Inténtalo de nuevo','Esa no es la respuesta correcta.<br><br><b>Pista:</b> '+x[3],'Reintentar',close)}}function show(i,t,x,b,fn){$('mi').textContent=i;$('mt').textContent=t;$('mx').innerHTML=x;$('mb').textContent=b;$('mb').onclick=()=>{close();fn&&fn()};$('modal').style.display='flex'}function close(){$('modal').style.display='none'}function map(){$('exercise').style.display='none';$('map').style.display='flex';$('display').textContent='Mapa de Niveles'}function restart(){lives=3;coins=0;unlocked=1;$('lives').textContent=3;$('coins').textContent=0;for(let i=2;i<=4;i++){$('n'+i).classList.add('locked');$('n'+i).classList.remove('completed')}map()}
</script></body></html>
